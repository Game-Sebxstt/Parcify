name: Servidor

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Una sola copia de yjs
        run: |
          test "$(npm ls yjs --all --parseable | xargs -n1 realpath | sort -u | wc -l)" -eq 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: SHARED_HASH al día con src/shared
        run: npm run shared:hash && git diff --exit-code src/shared/SHARED_HASH
      - name: Stack de pruebas (Postgres, Redis y SeaweedFS)
        run: docker compose -f compose.test.yml --profile s3 up -d --wait
      - run: npm run test:int
      - run: npm run build
      - name: Imagen Docker
        run: docker build -t parcify-server:ci .
      - name: Apagar el stack
        if: always()
        run: npm run stack:test:down
