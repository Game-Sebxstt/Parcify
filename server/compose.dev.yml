name: parcify-dev

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: parcify
      POSTGRES_PASSWORD: parcify_dev
      POSTGRES_DB: parcify
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcify -d parcify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--requirepass", "parcify_dev", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "parcify_dev", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.00
    profiles: ["s3"]
    command: ["server", "-s3", "-dir=/data"]
    ports: ["127.0.0.1:58333:8333"]
    volumes: [s3data:/data]

volumes:
  pgdata: {}
  redisdata: {}
  s3data: {}
